# 2026年10月 販促イベントカレンダー(貴社内限定)
# --------------------------------------------------------------------------
# 出典: モール公式 販促イベントカレンダー PDF (事前共有分) より転記
#
# 転記の検証: 各施策の付与率を積み上げた値が、PDF最下段の「最大付与率」行
# (ボーナスストアPlus参加かつ優良ストア前提) と全32日で一致することを
# tests/test_schedule_2026_10.py で検証している。
#
# 用語:
#   funding      mall  = モール負担(需要は押し上げるが自社コストにならない)
#                store = 自社負担(ポイント原資として計上する)
#   eligibility  all                        = 全ストア(エントリー不要)
#                promo_package              = プロモーションパッケージ加入ストア
#                bonus_store_plus           = ボーナスストアPlus参加ストア
#                bonus_store_plus_excellent = 参加かつ優良ストア
#
# traffic_multiplier は「付与率とは別に働くモール集客増」。
# 付与率の効果は需要モデルが総付与率から計算するため、ここで倍率を入れると
# 二重計上になる。広告出稿など別要因が確認できた施策にだけ入れること。
# 現時点では全施策 1.0(未設定)。

month: "2026-10"
extends_to: "2026-11-01"   # 爆買WEEKが11/1まで続くため計画対象を延長
source_note: "モール公式 販促イベントカレンダー(2026年10月・貴社内限定)"
entry_deadline_days_before: 3   # 個別に entry_deadline を書かない施策の既定値

benefits:
  # ======================================================================
  # 定常施策 — 毎日・全ストア・エントリー不要 (合計7%)
  # ======================================================================
  - id: store_point
    name: "ストアポイント"
    days: all
    rate: 0.01
    funding: store        # 自社のストアポイント原資。参加有無に関わらず毎日かかる
    eligibility: all
    note: "注文下限なし・付与上限なし"

  - id: line_daily
    name: "LINEと連携で毎日もらえる"
    days: all
    rate: 0.03
    funding: mall
    eligibility: all
    user_cap_yen: 5000
    user_cap_period: month
    note: "PayPayクレジット等での支払いが前提。PayPay残高等では2.5%"

  - id: paypay_credit
    name: "PayPayクレジット等ご利用分"
    days: all
    rate: 0.01
    funding: mall
    eligibility: all
    note: "PayPayポイント(通常)。注文下限・付与上限なし"

  - id: lyp_premium
    name: "LYPプレミアム会員特典"
    days: all
    rate: 0.02
    funding: mall
    eligibility: all
    user_cap_yen: 5000
    user_cap_period: month

  # ======================================================================
  # 日付が決まっている施策 — 全ストア(エントリー不要)
  # ======================================================================
  - id: first_day
    name: "1日開催ファーストデイ"
    days: [1]
    rate: 0.03
    funding: mall
    eligibility: all
    min_order_yen: 3000
    user_cap_yen: 2000
    user_cap_period: day

  - id: five_day
    name: "5のつく日"
    days: [5, 15, 25]
    rate: 0.04
    funding: mall
    eligibility: all
    user_cap_yen: 2000
    user_cap_period: day
    note: "全ストア対象。エントリー不要"

  - id: point_up
    name: "ポイントアップ+4%"
    days: [8]
    rate: 0.04
    funding: mall
    eligibility: all
    min_order_yen: 3000
    user_cap_yen: 2000
    user_cap_period: day
    note: "事前告知なし・事前のユーザー訴求NG。事前販促を組んではいけない"

  # ======================================================================
  # プロモーションパッケージ加入ストア向け
  # ======================================================================
  - id: premium_sunday
    name: "プレミアムな日曜日+5%"
    days: [4, 11, 18]
    rate: 0.05
    funding: mall
    eligibility: promo_package
    min_order_yen: 5000
    user_cap_yen: 3000
    user_cap_period: day
    note: "全ユーザー対象。10/25(日)は対象外"

  - id: kansha_day
    name: "ヤフショ感謝デー"
    days: [22]
    rate: 0.04
    funding: mall
    eligibility: promo_package
    user_cap_yen: 1000
    user_cap_period: day
    note: "シルバーランク+4%(既定)/ゴールドランク+5%。ランクに応じて rate を 0.05 に変更する"

  - id: mall_coupon
    name: "モールクーポン 1,000円OFF"
    days: [5, 15, 25]
    coupon_yen: 1000
    funding: mall
    eligibility: promo_package
    min_order_yen: 25000
    note: "注文下限25,000円。平均注文単価がこれを下回る場合は効果に算入されない"

  - id: bakugai_week
    name: "10月爆買WEEK"
    period: ["2026-10-30", "2026-11-01"]
    entry_unit: period
    funding: mall
    eligibility: promo_package
    tiers:
      - {min_total: 5000, rate: 0.04}
      - {min_total: 20000, rate: 0.07}
    user_cap_yen: 3500
    user_cap_period: period
    note: "加入ストアで買い回りOK。合計注文金額により付与率が変動。上限3,500円/3日間"

  # ======================================================================
  # ボーナスストアPlus — ここだけが日ごとのエントリー判断の対象
  # ======================================================================
  - id: bsplus_extra
    name: "ボーナスストアPlusはさらに+2%"
    days: [2, 7, 16, 20, 27, 28]
    rate: 0.02
    funding: mall
    eligibility: bonus_store_plus
    entry_deadline: "2026-09-16"   # 10月分ボーナスストア申込の締切
    min_order_yen: 3000
    user_cap_yen: 5000
    user_cap_period: day
    note: "参加して初めて開くモール負担の上乗せ。この6日がエントリーの主戦場"

  - id: bsplus_excellent_extra
    name: "ボーナスストアPlusかつ優良ストアはさらに+3%"
    days: [2, 7, 16, 20, 27, 28]
    rate: 0.03
    funding: mall
    eligibility: bonus_store_plus_excellent
    entry_deadline: "2026-09-16"   # 10月分ボーナスストア申込の締切
    min_order_yen: 3000
    user_cap_yen: 5000
    user_cap_period: day
    note: "優良ストア該当時のみ。現在は非該当のため評価に算入されない"

# ======================================================================
# 付与率で表せない施策・運用上の注意
# ======================================================================
notes:
  - days: [26, 27, 28]
    text: "ボーナスストアPlusのお買い物で引けるくじ(参加ストア対象)。当選確率が非公開のため期待値を置けず、需要モデルには算入していない。実際にはこの3日の参加価値をやや押し上げる"
  - days: [8]
    text: "ポイントアップ+4%は事前告知なし・事前のユーザー訴求NG。バナーやメルマガでの事前訴求を行わないこと"
  - days: [11, 12]
    text: "10/11(日)・10/12(月・スポーツの日)は連休。需要モデルの祝日補正は未実装のため、実績で上振れした場合は月次係数に吸収される"
  - text: "10月分のボーナスストア申込締切は2026-09-16。これを過ぎると当月のボーナスストアPlus指定日(10/2・7・16・20・27・28)に参加できない"
  - text: "平均注文単価5,529円に対し、爆買WEEKの7%段(合計20,000円以上)とモールクーポン(注文下限25,000円)は該当する注文がほぼ無く、実質的に機能しない"
