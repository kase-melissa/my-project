# ストア側の経済条件
# --------------------------------------------------------------------------
# ここの数値がそのまま採算判断に効く。自社の実数に置き換えて運用すること。
store:
  store_name: "犬猫用家電ストア(Yahoo!ショッピング店)"

  # 粗利率: モール手数料・決済手数料・送料・梱包費を引いた後の率
  gross_margin_rate: 0.32

  # 平均注文単価(円)と、注文単価の対数標準偏差
  # aov_sigma は注文明細から推定する(bonus_planner.calibrate.estimate_aov_sigma)
  # 自動給餌器・ペット用ドライヤー・空気清浄機など高単価商材が中心の想定
  aov: 19800
  aov_sigma: 0.55

  # 1注文あたりの付与ポイント上限(円)
  # 高単価商材では上限が効いて実効還元率が表示還元率を下回る
  point_cap_per_order: 5000

  # ポイント原資にかかる手数料率(かからない場合は 0)
  point_fee_rate: 0.0

  # 月間で使えるポイント原資の上限(円)
  monthly_point_budget: 500000

  # 採算ライン
  min_roas: 5.0        # 増分GMV / ポイント原資 がこれ未満の日は見送る
  min_net_value: 0     # 1エントリー単位あたりの純増効果の下限(円)

  # 新規顧客の将来価値
  # 犬猫用家電は交換フィルター・替えブラシ等の消耗品リピートが効くため、
  # 新規獲得1件あたりの将来粗利を加味する
  new_customer_ratio: 0.50
  ltv_uplift_per_new_customer: 4200

  # 採算に関わらず必ずエントリーするイベントID(ブランド露出・在庫消化などの経営判断)
  # 例: ["chou_paypay_matsuri"]
  mandatory_event_ids: []
