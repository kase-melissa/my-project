# Yahoo!ショッピング顧客の行動モデル
# --------------------------------------------------------------------------
# 係数の出どころは3種類ある。
#
#   [日別実測]  2026-06-16〜09-15 の日別実績(92日)＋参加履歴から回帰で推定
#   [月次校正]  calibrate コマンドが月次実績から上書きする
#   [仮値]      まだ実測できていない
#
# 日別実測の再現:
#   python3 tools/analyze_daily.py \
#       --daily data/sales_history_daily.csv \
#       --participation data/bsplus_participation.csv
#
# 水準(base_sessions・base_cvr)と月次季節係数は月次実績から校正する:
#   python3 -m bonus_planner calibrate \
#       --history data/sales_history_monthly.csv \
#       --schedule data/promo_schedule/2026-10.yaml \
#       --participation data/bsplus_participation.csv \
#       --out config/behavior_calibrated.yaml
#
# --schedule を付けないと、実績に含まれる販促イベントの上振れが
# 差し引かれず、ベースライン予測が過大になる。
behavior:
  # 需要は「集客 × 転換率」に分解して持つ。
  # 実績では成長の大半がセッション増ではなく転換率と単価の改善だったため、
  # 1本にまとめるとトレンド推定を誤る。
  #
  # 定常施策だけの日(総付与率 = baseline_rate)の1日あたりセッション数
  base_sessions: 240.0
  # 基準転換率(注文数 / セッション)
  base_cvr: 0.10

  # 曜日係数(平均1になるよう正規化される)  [日別実測・縮小推定]
  #
  # 日曜が突出している。仮値の1.18に対し実測は2.12で、
  # 縮小推定(仮値との幾何平均)を採っても1.60。
  # プレミアムな日曜日の評価がこれで大きく変わる。
  #
  # 素の土曜は92日中4日しかなく点推定が安定しないため、
  # 縮小して仮値寄りに置いている(実測0.79 → 採用0.94)。
  #
  #   実測 mon=0.845 tue=0.769 wed=0.932 thu=0.739 fri=0.806 sat=0.792 sun=2.116
  #   仮値 mon=0.950 tue=0.920 wed=0.950 thu=0.950 fri=1.000 sat=1.080 sun=1.180
  dow:
    mon: 0.906
    tue: 0.851
    wed: 0.952
    thu: 0.848
    fri: 0.908
    sat: 0.936
    sun: 1.599

  # 給料日サイクル係数  [日別実測・縮小推定]
  #
  # 推定時は 5のつく日(5/15/25)を必ず制御する。しないと
  # 5・15・25を含むビンが押し上げられる(制御なしで d11_15 が 1.249)。
  #
  # 月末(d25_end)の山は仮値1.16ほど強くなく、
  # 逆に月後半の谷(d16_20)は仮値より深い。
  #
  #   実測 d01_05=1.160 d06_10=1.045 d11_15=1.214 d16_20=0.721 d21_24=0.799 d25_end=1.061
  dom:
    d01_05: 1.110
    d06_10: 0.992
    d11_15: 1.086
    d16_20: 0.819
    d21_24: 0.877
    d25_end: 1.116

  # 月次の季節係数("01".."12")。未指定の月は1.0
  # ペット家電は換毛期(春・秋)と猛暑期、年末商戦に動く
  month:
    "03": 1.08
    "04": 1.05
    "07": 1.12
    "08": 1.10
    "09": 1.05
    "10": 1.06
    "12": 1.15

  # 付与率への反応の基準点。定常施策だけの日の「全ストア共通」付与率。
  # 2026年10月のカレンダーでは
  # ストアポイント1% + LINE連携3% + PayPayクレジット1% + LYPプレミアム2% = 7%
  baseline_rate: 0.07

  # ---- 市場規模(パイの大きさ)  [日別実測] ----
  # 全ストア共通の付与率が上がるとモール全体の来訪者が増える度合い。
  # 競合も同条件なので自社シェアは変わらず、パイだけが大きくなる。
  #
  # 5のつく日(7%→11%)でセッション +63.0% (t=6.62)。
  # 弾力性換算で 1.08 ± 0.16 だが、モデルの上限である 1.0 を採る
  # (推定値の0.5標準誤差以内。1を超える=付与率以上に来訪が伸びる、
  #  という主張は3ヶ月・5のつく日9回の観測では踏み込みすぎる)。
  market_elasticity: 1.00

  # ---- 来訪者の質  [日別実測] ----
  # 全ストア共通の付与率が上がる日は、来訪者の「構成」も変わる。
  # 「5のつく日を待って買う」層が動くため、1セッションあたりの
  # 購買確率が上がる。人が増えるだけではない。
  #
  # 5のつく日(7%→11%)で転換率 +66.0% (t=3.82)、弾力性換算 1.12 ± 0.29。
  # 5のつく日と自社の参加日はこの期間で1日も重ならないため、
  # この効果は参加効果と混ざらずに識別できている。
  #
  # ※ 5のつく日1種類からの推定。他のモール施策でも同じ弾力性が
  #    成り立つかは未検証。
  intent_elasticity: 1.12

  # ---- シェア(パイの取り分)  [日別実測・レンジの中心] ----
  # 競合に対する付与率の「絶対差」で決まる。比率ではない点が重要。
  # 顧客にとって上乗せ2ポイント分の価値は、基準率が7%でも11%でも同じ金額。
  #
  #   優位 2ポイント → 注文 +20%
  #   優位 4ポイント → 注文 +20% x 2^0.7 = +32.5%
  #   優位 1ポイント → 注文 +20% x 0.5^0.7 = +12.3%
  #
  # 日別実測の推定レンジは 0.17〜0.29。幅が残る理由は2つ。
  #   1. 参加日は観測できていないモール販促(プレミアムな日曜日・
  #      感謝デー等)を狙って選ばれている。実際、参加はセッションも
  #      +48%(t=7.45)動かしているように見えるが、エントリー自体が
  #      来訪を増やすことはありえない。この分だけ転換率への効果も
  #      上振れて見えている
  #   2. 参加日にモール負担の+2%が開いていたかどうかが記録に残っていない
  # 既定はレンジの中心に近い0.20。感応度分析で両端を振っている。
  reference_advantage: 0.02
  share_gain_at_reference: 0.20
  share_elasticity: 0.70

  # traffic_multiplier が複数重なったときの逓減
  overlap_decay: 0.55

  calibration_note: "日別実績(2026-06-16〜09-15・92日)＋参加履歴で校正 → 曜日係数・給料日サイクル係数・market_elasticity・intent_elasticity・share_gain_at_reference"
