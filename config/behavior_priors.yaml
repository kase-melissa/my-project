# Yahoo!ショッピング顧客の行動モデル(初期仮値)
# --------------------------------------------------------------------------
# !! 重要 !!
# 以下は業界的な相場観にもとづく「出発点」であって、自社の実測値ではない。
#
# 実績エクスポート(セッション列つき)があれば
# base_sessions・base_cvr・month は校正できる:
#   python3 -m bonus_planner calibrate \
#       --history data/sales_history_monthly.csv \
#       --schedule data/promo_schedule/2026-10.yaml \
#       --out config/behavior_calibrated.yaml
#
# --schedule を付けないと、実績に含まれる販促イベントの上振れが
# 差し引かれず、ベースライン予測が過大になる。
#
# 曜日係数・給料日サイクル係数・rate_elasticity は日次データがないと校正できない。
behavior:
  # 需要は「集客 × 転換率」に分解して持つ。
  # 実績では成長の大半がセッション増ではなく転換率と単価の改善だったため、
  # 1本にまとめるとトレンド推定を誤る。
  #
  # 定常施策だけの日(総付与率 = baseline_rate)の1日あたりセッション数
  base_sessions: 240.0
  # 基準転換率(注文数 / セッション)
  base_cvr: 0.10

  # 曜日係数(平均1になるよう正規化される) ※日次データがないため未校正
  dow:
    mon: 0.95
    tue: 0.92
    wed: 0.95
    thu: 0.95
    fri: 1.00
    sat: 1.08
    sun: 1.18

  # 給料日サイクル係数 ※日次データがないため未校正
  # 25日以降と月初に高単価家電の決済が寄る
  dom:
    d01_05: 1.05
    d06_10: 0.93
    d11_15: 0.96
    d16_20: 0.92
    d21_24: 0.95
    d25_end: 1.16

  # 月次の季節係数("01".."12")。未指定の月は1.0
  # ペット家電は換毛期(春・秋)と猛暑期、年末商戦に動く
  month:
    "03": 1.08
    "04": 1.05
    "07": 1.12
    "08": 1.10
    "09": 1.05
    "10": 1.06
    "12": 1.15

  # 付与率への反応の基準点。定常施策だけの日の「全ストア共通」付与率。
  # 2026年10月のカレンダーでは
  # ストアポイント1% + LINE連携3% + PayPayクレジット1% + LYPプレミアム2% = 7%
  baseline_rate: 0.07

  # ---- 市場規模(パイの大きさ) ※日次データがないため未校正 ----
  # 全ストア共通の付与率が上がるとモール全体の来訪者が増える度合い。
  # 競合も同条件なので自社シェアは変わらず、パイだけが大きくなる。
  # 0.9 は「5のつく日(7%→11%)で来訪が約1.5倍」に合わせた値。
  # 自社の実績で 5のつく日の伸びが分かれば、そこから逆算して設定し直すこと。
  market_elasticity: 0.90

  # ---- シェア(パイの取り分) ※日次データがないため未校正 ----
  # 競合に対する付与率の「絶対差」で決まる。比率ではない点が重要。
  # 顧客にとって上乗せ2ポイント分の価値は、基準率が7%でも11%でも同じ金額。
  #
  #   優位 2ポイント → 注文 +20%
  #   優位 4ポイント → 注文 +20% x 2^0.7 = +32.5%
  #   優位 1ポイント → 注文 +20% x 0.5^0.7 = +12.3%
  reference_advantage: 0.02
  share_gain_at_reference: 0.20
  share_elasticity: 0.70

  # traffic_multiplier が複数重なったときの逓減
  overlap_decay: 0.55

  calibration_note: "未キャリブレーション(初期仮値)"
